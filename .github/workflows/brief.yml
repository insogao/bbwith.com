name: Daily AI brief

on:
  schedule:
    # 23:53 UTC = 07:53 Beijing time
    - cron: "53 23 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Only collect sources, do not call the AI or commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect sources (dry run)
        if: ${{ inputs.dry }}
        run: python scraper/brief.py --dry
      - name: Write the brief
        if: ${{ !inputs.dry }}
        env:
          SUPBI_AI_BASE_URL: ${{ secrets.SUPBI_AI_BASE_URL }}
          SUPBI_AI_API_KEY: ${{ secrets.SUPBI_AI_API_KEY }}
          SUPBI_AI_MODEL: ${{ secrets.SUPBI_AI_MODEL }}
        run: python scraper/brief.py
      - name: Check the site builds
        if: ${{ !inputs.dry }}
        run: python site_src/generate.py
      - name: Commit
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "bbwith-bot"
          git config user.email "bbwith-bot@users.noreply.github.com"
          git add data/news/brief
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "news: AI brief $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase
          git push

name: Daily App Store prices

on:
  schedule:
    # 23:37 UTC = 07:37 Beijing time. Off the hour to avoid GitHub's busiest minutes.
    - cron: "37 23 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Re-discover App Store storefronts first"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-discover storefronts
        if: ${{ inputs.probe }}
        run: |
          pip install pycountry
          python scraper/crawl.py --probe

      - name: Crawl App Store
        run: python scraper/crawl.py

      - name: Normalize prices
        run: python scraper/build_data.py

      - name: Gift card prices
        continue-on-error: true   # retailer pages change; never block the daily App Store data
        run: python scraper/giftcards.py

      - name: Check the site builds
        run: python site_src/generate.py

      - name: Commit data
        run: |
          git config user.name "bbwith-bot"
          git config user.email "bbwith-bot@users.noreply.github.com"
          git add data/daily data/giftcards scraper/storefronts.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data: App Store prices $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase
          git push

      - name: Ping IndexNow
        run: |
          sleep 240   # give Cloudflare Pages time to deploy the new build
          python scraper/indexnow.py

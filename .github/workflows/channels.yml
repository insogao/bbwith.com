name: Domestic top-up prices

on:
  schedule:
    # every 4 hours at minute 17 (UTC): 08:17, 12:17, 16:17, 20:17, 00:17, 04:17 Beijing time
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check secrets
        id: check
        env:
          S16688_TOKEN: ${{ secrets.S16688_TOKEN }}
        run: |
          if [ -z "$S16688_TOKEN" ]; then
            echo "S16688_TOKEN is not set, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect 16688 top-up prices
        if: steps.check.outputs.skip != 'true'
        env:
          S16688_TOKEN: ${{ secrets.S16688_TOKEN }}
          S16688_DEVICE_KEY: ${{ secrets.S16688_DEVICE_KEY }}
          S16688_VISITOR_KEY: ${{ secrets.S16688_VISITOR_KEY }}
        run: python scraper/channels.py

      - name: Watch public shop products
        continue-on-error: true
        run: python scraper/shopwatch.py

      - name: Pick shop products (AI)
        continue-on-error: true
        env:
          SUPBI_AI_BASE_URL: ${{ secrets.SUPBI_AI_BASE_URL }}
          SUPBI_AI_API_KEY: ${{ secrets.SUPBI_AI_API_KEY }}
          SUPBI_AI_MODEL: ${{ secrets.SUPBI_AI_MODEL }}
        run: |
          python scraper/shoppick.py
          if ! git diff --quiet data/merchants/watch.json; then python scraper/shopwatch.py; fi

      - name: Verify merchant listings
        continue-on-error: true
        run: python scraper/merchants.py

      - name: Check the site builds
        run: python site_src/generate.py

      - name: Commit data
        run: |
          git config user.name "bbwith-bot"
          git config user.email "bbwith-bot@users.noreply.github.com"
          git add data/channels data/merchants
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: domestic prices and merchant checks $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git pull --rebase
          git push

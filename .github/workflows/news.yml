name: Deal news scan

on:
  schedule:
    # 01:23 and 11:23 UTC = 09:23 and 19:23 Beijing time
    - cron: "23 1,11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan feeds and open issues for deal candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper/news.py --issues
      - name: Remember seen links
        run: |
          git config user.name "bbwith-bot"
          git config user.email "bbwith-bot@users.noreply.github.com"
          git add data/news/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "news: seen links [skip ci]"
          git pull --rebase
          git push

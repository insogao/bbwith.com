name: Probe pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python scraper/tools/probe.py scraper/tools/probe_urls.txt
      - run: |
          git config user.name "bbwith-bot"; git config user.email "bbwith-bot@users.noreply.github.com"
          git checkout --orphan probe; git rm -rq --cached .; git add -f probe
          git commit -qm "probe [skip ci]"; git push -f origin probe
